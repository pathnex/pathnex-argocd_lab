replicaCount: 1
image:
  repository: nginx
  tag: "1.25"
  pullPolicy: IfNotPresent
service:
  type: NodePort
  port: 80
  targetPort: 80
  name: pathnex-nginx-service
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
nodeSelector: {}
tolerations: []
affinity: {}