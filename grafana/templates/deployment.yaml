
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathnex-grafana
  labels:
    app: pathnex-grafana

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: pathnex-grafana

  template:
    metadata:
      labels:
        app: pathnex-grafana

    spec:
      securityContext:
        fsGroup: 472

      containers:
        - name: pathnex-grafana
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
          {{- end }}

      {{- if .Values.persistence.enabled }}
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: pathnex-grafana-pvc
      {{- end }}
